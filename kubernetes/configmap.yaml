# Non-secret runtime configuration. Secrets live in a Secret object (see secret.yaml.example).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wanderlust-config
  namespace: wanderlust
data:
  # backend
  MONGODB_URI: "mongodb://mongo:27017/wanderlust"
  REDIS_URL: "redis://redis:6379"
  PORT: "8080"
  NODE_ENV: "production"
  ACCESS_COOKIE_MAXAGE: "900000"
  ACCESS_TOKEN_EXPIRES_IN: "15m"
  REFRESH_COOKIE_MAXAGE: "604800000"
  REFRESH_TOKEN_EXPIRES_IN: "7d"
  # The frontend and backend share one hostname behind the ingress,
  # so CORS origin and the API base path are both same-origin.
  FRONTEND_URL: "http://wanderlust.example.com"
  # frontend (Vite reads VITE_* from the environment)
  VITE_API_PATH: ""
